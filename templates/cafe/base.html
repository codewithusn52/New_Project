<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CapCafe Project{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

    <!-- Navbar -->
    <nav class="mb-4 pb-2 border-bottom d-flex justify-content-between align-items-center">
        <h2 class="m-0">☕ CapCafe</h2>
        <div>
            <a href="{% url 'mycafe:home' %}" class="btn btn-outline-primary btn-sm">Home</a>
            <a href="{% url 'mycafe:menu_list' %}" class="btn btn-outline-primary btn-sm">Menu</a>
            <a href="{% url 'mycafe:item_create' %}" class="btn btn-success btn-sm">+ Add Item</a>
            <a href="/admin/" target="_blank" class="btn btn-outline-secondary btn-sm ms-2">Admin</a>
        </div>
    </nav>

    <!-- Flash Messages -->
    {% if messages %}
        <div class="mb-3">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }}" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <!-- Page Content -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="mt-5 pt-3 border-top text-center text-muted fs-7">
        <p>&copy; 2026 CapCafe Project. All rights reserved.</p>
    </footer>

</body>
</html>
